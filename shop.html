<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Collections — Krabe Kollection</title>
  <meta name="description" content="Browse the Krabe Kollection catalog. Native wear, Kaftans, tailored suiting, and luxury streetwear. Mobile-first shopping experience.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/brand/krabe main logo.svg">
  <link rel="alternate icon" type="image/png" href="assets/brand/kraberefined-logo-blue.png">

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <style>
    @media (max-width: 992px) {
      #categoryFilterStrip {
        padding: 10px 36px;
      }
    }
  </style>
</head>
<body>

  <!-- =========================================================================
       REUSABLE SITE HEADER & NAVIGATION COMPONENT
       ========================================================================= -->
  <div id="krabeHeader"></div>

  <!-- =========================================================================
       3. MOBILE-FIRST STREAMLINED FILTER BAR (ALWAYS VISIBLE EVERYWHERE)
       Row 1: Gender | Row 2: Category | Row 3: Size & Sort
       ========================================================================= -->
  <div class="mobile-filter-container">
    <div class="container" style="padding: 0;">
      
      <!-- Row 1: GENDER (Always visible, prominent tabs) -->
      <div class="gender-filter-strip">
        <button type="button" class="gender-btn body-12 active" onclick="setGenderFilter(this, 'all')">All</button>
        <button type="button" class="gender-btn body-12" onclick="setGenderFilter(this, 'men')">Men</button>
        <button type="button" class="gender-btn body-12" onclick="setGenderFilter(this, 'women')">Women</button>
        <button type="button" class="gender-btn body-12" onclick="setGenderFilter(this, 'unisex')">Unisex</button>
      </div>

      <!-- Row 2: CATEGORY (Always visible horizontal pills with animated scroll cues) -->
      <div class="account-tabs-wrap" style="border-bottom: 1px solid var(--color-border); background: var(--color-white);">
        <!-- Subtle Animated Scroll Cue (Left) -->
        <div class="account-tabs-cue account-tabs-cue-left" id="categoryTabsCueLeft" aria-hidden="true">
          <div class="chevron-stream">
            <svg class="ch-1" width="9" height="14" viewBox="0 0 9 14" fill="none"><path d="M7.5 1.5L2 7L7.5 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="ch-2" width="9" height="14" viewBox="0 0 9 14" fill="none"><path d="M7.5 1.5L2 7L7.5 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="ch-3" width="9" height="14" viewBox="0 0 9 14" fill="none"><path d="M7.5 1.5L2 7L7.5 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>

        <div class="category-filter-strip account-tabs-list" id="categoryFilterStrip" style="border-bottom: none; width: 100%;">
          <button type="button" class="category-pill body-12 active" data-category="all" onclick="setCategoryFilter(this, 'all')">All Categories</button>
          <button type="button" class="category-pill body-12" data-category="native" onclick="setCategoryFilter(this, 'native')">Native Wear</button>
          <button type="button" class="category-pill body-12" data-category="formal" onclick="setCategoryFilter(this, 'formal')">English &amp; Suiting</button>
          <button type="button" class="category-pill body-12" data-category="streetwear" onclick="setCategoryFilter(this, 'streetwear')">Streetwear Drops</button>
        </div>

        <!-- Subtle Animated Scroll Cue (Right) -->
        <div class="account-tabs-cue account-tabs-cue-right" id="categoryTabsCueRight" aria-hidden="true">
          <div class="chevron-stream">
            <svg class="ch-1" width="9" height="14" viewBox="0 0 9 14" fill="none"><path d="M1.5 1.5L7 7L1.5 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="ch-2" width="9" height="14" viewBox="0 0 9 14" fill="none"><path d="M1.5 1.5L7 7L1.5 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="ch-3" width="9" height="14" viewBox="0 0 9 14" fill="none"><path d="M1.5 1.5L7 7L1.5 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>

      <!-- Row 3: STATUS & SORT -->
      <div class="sub-filter-strip">
        <div class="catalog-count body-12" style="color: var(--color-text-muted); font-weight: 600;">
          Showing 0 results
        </div>

        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="filter-mini-label body-12" style="margin-right: 0; color: var(--color-text-muted);">Sort:</span>
          <select class="sort-select-compact body-12" aria-label="Sort products">
            <option value="featured">Featured</option>
            <option value="newest">Newest</option>
            <option value="price-asc">Price: Low-High</option>
            <option value="price-desc">Price: High-Low</option>
          </select>
        </div>
      </div>

    </div>
  </div>

  <!-- =========================================================================
       4. PRODUCT CATALOG GRID (Dynamically populated from Supabase)
       ========================================================================= -->
  <main class="container">
    <div class="simplified-catalog-grid" id="catalogProductGrid">
      <div style="grid-column: 1 / -1; text-align: center; padding: 48px 16px; color: var(--color-text-muted);">
        <p class="body-14" style="color: var(--color-text-muted);">Loading collection from atelier...</p>
      </div>
    </div>

    <!-- Catalog Pagination (Max 10 pages) -->
    <div class="catalog-pagination" id="catalogPagination" style="display: none;"></div>
  </main>

  <!-- =========================================================================
       5. GLOBAL FOOTER
       ========================================================================= -->
  <div id="krabeFooter"></div>

  <!-- Slide-Out Cart Drawer -->
  <div class="cart-drawer-overlay" id="cartOverlay" aria-hidden="true">
    <div class="cart-drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-labelledby="cartDrawerTitle">
      <div class="cart-drawer-header">
        <h3 class="cart-drawer-title h5" id="cartDrawerTitle">Shopping Bag</h3>
        <button type="button" class="cart-close-btn" id="cartCloseBtn" aria-label="Close Shopping Bag">
          <svg style="width: 22px; height: 22px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="cart-free-shipping body-12">✓ Free Lagos Delivery on orders over ₦200,000</div>
      <div class="cart-drawer-body"></div>
      <div class="cart-drawer-footer">
        <div class="cart-subtotal-row">
          <span class="cart-subtotal-label body-14">Subtotal</span>
          <span class="cart-subtotal-amount body-18">₦0</span>
        </div>
        <a href="checkout.html" class="btn-checkout body-14">Proceed to Checkout &rarr;</a>
      </div>
    </div>
  </div>

  <!-- Supabase SDK & Krabe Stack -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/auth-modal.js"></script>
  <script src="js/search-modal.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Live State (Gender, Category, Search, Sort, Pagination)
    let currentGender = 'all';
    let currentCategory = 'all';
    let currentSearch = '';
    let currentSort = 'featured';
    let currentPage = 1;
    const PAGE_SIZE = 10;
    const MAX_PAGES = 10;
    let totalProductsCount = 0;
    let catalogRetries = 0;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatCategory(cat) {
      if (cat === 'native') return 'NATIVE WEAR';
      if (cat === 'formal') return 'ENGLISH & SUITING';
      if (cat === 'streetwear') return 'STREETWEAR';
      return (cat || 'MADE TO ORDER').toUpperCase();
    }

    function formatGender(gender) {
      if (gender === 'male' || gender === 'men') return 'MEN';
      if (gender === 'female' || gender === 'women') return 'WOMEN';
      return 'UNISEX';
    }

    function updateResultsCountBanner(visibleOnPage) {
      const countEl = document.querySelector('.catalog-count');
      if (!countEl) return;

      if (totalProductsCount === 0) {
        countEl.innerHTML = currentSearch
          ? `Showing 0 results for: <strong>"${escapeHtml(currentSearch)}"</strong> &bull; <a href="javascript:void(0)" onclick="clearSearchFilter()" style="color: var(--color-primary); text-decoration: underline; font-weight: 600;">Clear Search</a>`
          : 'Showing 0 results';
        return;
      }

      const from = (currentPage - 1) * PAGE_SIZE + 1;
      const to = Math.min(from + visibleOnPage - 1, totalProductsCount);
      const totalWord = totalProductsCount === 1 ? 'garment' : 'garments';

      let text = '';
      if (totalProductsCount <= PAGE_SIZE) {
        text = `Showing ${totalProductsCount} ${totalWord}`;
      } else {
        text = `Showing ${from}–${to} of ${totalProductsCount} ${totalWord}`;
      }

      if (currentSearch) {
        text += ` for: <strong>"${escapeHtml(currentSearch)}"</strong> &bull; <a href="javascript:void(0)" onclick="clearSearchFilter()" style="color: var(--color-primary); text-decoration: underline; font-weight: 600;">Clear Search</a>`;
      }

      countEl.innerHTML = text;
    }

    async function fetchCatalogFromDatabase() {
      const grid = document.getElementById('catalogProductGrid');
      const paginationEl = document.getElementById('catalogPagination');
      if (!grid) return;

      const client = window.krabeClient || (window.KRABE_CONFIG && typeof window.KRABE_CONFIG.getClient === 'function' ? window.KRABE_CONFIG.getClient() : null);
      if (!client) {
        if (++catalogRetries <= 30) {
          setTimeout(fetchCatalogFromDatabase, 150);
        }
        return;
      }

      grid.innerHTML = `
        <div style="grid-column: 1 / -1; text-align: center; padding: 48px 16px; color: var(--color-text-muted);">
          <p class="body-14" style="color: var(--color-text-muted);">Loading collection from atelier...</p>
        </div>
      `;

      try {
        // Base query with exact count
        let query = client
          .from('product')
          .select(`
            id,
            title,
            slug,
            category,
            gender,
            type,
            is_featured,
            is_new_arrival,
            created_at,
            search_text,
            product_variation (
              id,
              color,
              price,
              main_image,
              quantity,
              size
            )
          `, { count: 'exact' });

        // 1. Gender Constraint
        if (currentGender === 'men' || currentGender === 'male') {
          query = query.in('gender', ['male', 'unisex']);
        } else if (currentGender === 'women' || currentGender === 'female') {
          query = query.in('gender', ['female', 'unisex']);
        } else if (currentGender === 'unisex') {
          query = query.eq('gender', 'unisex');
        }

        // 2. Category Constraint
        if (currentCategory && currentCategory !== 'all') {
          query = query.eq('category', currentCategory);
        }

        // 3. Search Text (IGNORE constraint if empty; searches lowercase search_text)
        if (currentSearch && currentSearch.trim().length > 0) {
          const term = currentSearch.toLowerCase().trim();
          query = query.ilike('search_text', `%${term}%`);
        }

        // 4. Sorting
        if (currentSort === 'newest') {
          query = query.order('created_at', { ascending: false });
        } else {
          // Default 'featured'
          query = query
            .order('is_featured', { ascending: false })
            .order('created_at', { ascending: false });
        }

        // 5. Pagination Range (Max 10 items per page)
        const from = (currentPage - 1) * PAGE_SIZE;
        const to = from + PAGE_SIZE - 1;
        query = query.range(from, to);

        const { data: products, count, error } = await query;
        if (error) throw error;

        totalProductsCount = typeof count === 'number' ? count : (products ? products.length : 0);

        // Sort by variation price if price-asc / price-desc selected
        if (products && products.length > 0) {
          if (currentSort === 'price-asc') {
            products.sort((a, b) => {
              const pA = Number((a.product_variation?.[0] || {}).price) || 0;
              const pB = Number((b.product_variation?.[0] || {}).price) || 0;
              return pA - pB;
            });
          } else if (currentSort === 'price-desc') {
            products.sort((a, b) => {
              const pA = Number((a.product_variation?.[0] || {}).price) || 0;
              const pB = Number((b.product_variation?.[0] || {}).price) || 0;
              return pB - pA;
            });
          }
        }

        renderProductGrid(products);
        renderPagination();
        updateResultsCountBanner(products ? products.length : 0);

      } catch (err) {
        console.warn('[Shop] Could not load products from database:', err);
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 48px 16px; color: var(--color-text-muted);">
            <p class="body-16" style="font-weight: 700; color: var(--color-obsidian); margin-bottom: 8px;">Error loading collection.</p>
            <p class="body-14" style="color: var(--color-text-muted); margin-bottom: 16px;">Please check your connection and try again.</p>
            <button type="button" class="btn btn-outline-dark body-12" onclick="fetchCatalogFromDatabase()" style="padding: 6px 16px; font-weight: 700;">Retry</button>
          </div>
        `;
        if (paginationEl) paginationEl.style.display = 'none';
      }
    }

    function renderProductGrid(products) {
      const grid = document.getElementById('catalogProductGrid');
      if (!grid) return;

      if (!products || products.length === 0) {
        grid.innerHTML = `
          <div class="filter-empty-state" style="grid-column: 1 / -1; text-align: center; padding: 48px 16px; color: var(--color-text-muted);">
            <p class="body-16" style="font-weight: 700; color: var(--color-obsidian); margin-bottom: 8px;">No garments found matching the selected criteria.</p>
            <p class="body-14" style="color: var(--color-text-muted); margin-bottom: 16px;">Try adjusting your search terms or resetting active filters.</p>
            <button type="button" class="btn btn-outline-dark body-12" onclick="resetAllFilters()" style="padding: 8px 20px; font-weight: 700;">Reset Filters</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = products.map(prod => {
        const variations = prod.product_variation || [];
        const isRTW = (prod.type || '').toLowerCase() === 'ready to wear';

        // For RTW, prefer an in-stock variant if available
        let defaultVar = variations[0] || {};
        if (isRTW && variations.length > 0) {
          const inStock = variations.find(v => v.quantity != null && Number(v.quantity) > 0);
          if (inStock) defaultVar = inStock;
        }

        const displayPrice = defaultVar.price ? Number(defaultVar.price) : 0;
        const displayImage = defaultVar.main_image || 'assets/brand/krabe main logo.svg';
        const priceNaira = '₦' + displayPrice.toLocaleString('en-NG');
        const variantId = defaultVar.id || '';
        const defaultSize = defaultVar.size || 'M';
        const catClean = (prod.category || 'native').toString().toLowerCase().trim();
        const genderClean = (prod.gender || 'unisex').toString().toLowerCase().trim();

        const variantCount = variations.length;
        const variantBadgeHTML = variantCount > 1 
          ? `<div class="product-variants-note body-12" style="color: var(--color-text-muted); font-weight: 600; margin-top: 6px;">${variantCount} variants available</div>` 
          : '';

        const badgeHTML = typeof window.getProductBadgesHTML === 'function'
          ? window.getProductBadgesHTML(prod)
          : '';

        const productLink = typeof window.getProductUrl === 'function'
          ? window.getProductUrl(prod, variantId)
          : (prod.slug ? `/product/${encodeURIComponent(prod.slug)}${variantId ? `?variant=${variantId}` : ''}` : `product.html?id=${prod.id}`);

        const totalStock = isRTW ? variations.reduce((sum, v) => sum + (Number(v.quantity) || 0), 0) : null;
        const isSoldOut = isRTW && (variations.length === 0 || totalStock <= 0 || (defaultVar.quantity != null && Number(defaultVar.quantity) <= 0));
        const stockQty = (isRTW && defaultVar.quantity != null) ? Number(defaultVar.quantity) : null;

        const quickAddButtonHTML = isSoldOut
          ? `
            <button type="button" class="btn-quick-add body-12" disabled style="opacity: 0.6; cursor: not-allowed; pointer-events: none; background: rgba(0,0,0,0.65);">
              Sold Out
            </button>
          `
          : `
            <button type="button" class="btn-quick-add js-quick-add body-12" 
                    data-product-id="${prod.id}"
                    data-variant-id="${variantId}"
                    data-variation-id="${variantId}"
                    data-title="${escapeHtml(prod.title)}" 
                    data-price="${displayPrice}" 
                    data-size="${escapeHtml(defaultSize)}"
                    data-color="${escapeHtml(defaultVar.color || 'Standard')}"
                    data-image="${displayImage}"
                    data-product-type="${escapeHtml(prod.type || '')}"
                    data-stock-quantity="${stockQty != null ? stockQty : ''}">
              + Quick Add (${escapeHtml(defaultSize)})
            </button>
          `;

        return `
          <div class="product-card" 
               data-gender="${genderClean}" 
               data-category="${catClean}" 
               data-price="${displayPrice}"
               data-featured="${prod.is_featured ? '1' : '0'}"
               data-created="${prod.created_at || ''}">
            <div class="product-media">
              ${badgeHTML}
              <a href="${productLink}" style="display: block; width: 100%; height: 100%;">
                <img src="${displayImage}" alt="${escapeHtml(prod.title)}" loading="lazy">
              </a>
              <div class="quick-add-overlay">
                ${quickAddButtonHTML}
              </div>
            </div>
            <div class="product-info">
              <span class="product-category-label body-10">${formatCategory(catClean)} &bull; ${formatGender(genderClean)}</span>
              <h3 class="product-title body-14"><a href="${productLink}">${escapeHtml(prod.title)}</a></h3>
              <div class="product-price-row">
                <span class="product-price body-18">${priceNaira}</span>
              </div>
              ${variantBadgeHTML}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderPagination() {
      const paginationEl = document.getElementById('catalogPagination');
      if (!paginationEl) return;

      const totalPages = Math.min(Math.ceil(totalProductsCount / PAGE_SIZE) || 1, MAX_PAGES);

      if (totalPages <= 1) {
        paginationEl.style.display = 'none';
        paginationEl.innerHTML = '';
        return;
      }

      paginationEl.style.display = 'flex';

      let html = `
        <button type="button" class="page-btn page-btn-prev body-14" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})" aria-label="Previous Page">&larr;</button>
      `;

      for (let i = 1; i <= totalPages; i++) {
        html += `
          <button type="button" class="page-btn body-14 ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})" aria-label="Page ${i}">${i}</button>
        `;
      }

      html += `
        <button type="button" class="page-btn page-btn-next body-14" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})" aria-label="Next Page">&rarr;</button>
      `;

      paginationEl.innerHTML = html;
    }

    function goToPage(page) {
      const totalPages = Math.min(Math.ceil(totalProductsCount / PAGE_SIZE) || 1, MAX_PAGES);
      if (page < 1 || page > totalPages || page === currentPage) return;

      currentPage = page;

      try {
        const url = new URL(window.location);
        if (currentPage === 1) {
          url.searchParams.delete('page');
        } else {
          url.searchParams.set('page', currentPage);
        }
        window.history.replaceState({}, '', url);
      } catch (e) {}

      fetchCatalogFromDatabase();

      const grid = document.getElementById('catalogProductGrid');
      if (grid) {
        grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function setGenderFilter(btn, gender) {
      document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      currentGender = (gender || 'all').toLowerCase();
      currentPage = 1;

      try {
        const url = new URL(window.location);
        url.searchParams.delete('page');
        if (currentGender === 'all') {
          url.searchParams.delete('gender');
        } else {
          url.searchParams.set('gender', currentGender);
        }
        window.history.replaceState({}, '', url);
      } catch (e) {}

      fetchCatalogFromDatabase();
      setTimeout(updateCategoryScrollIndicators, 50);
    }

    function setCategoryFilter(btn, cat) {
      const pills = document.querySelectorAll('.category-pill');
      pills.forEach(b => b.classList.remove('active'));

      if (btn) {
        btn.classList.add('active');
      } else {
        const matchingPill = Array.from(pills).find(p => (p.dataset.category || '').toLowerCase() === (cat || '').toLowerCase());
        if (matchingPill) matchingPill.classList.add('active');
      }

      currentCategory = (cat || 'all').toLowerCase();
      currentPage = 1;

      try {
        const url = new URL(window.location);
        url.searchParams.delete('page');
        if (currentCategory === 'all') {
          url.searchParams.delete('category');
        } else {
          url.searchParams.set('category', currentCategory);
        }
        window.history.replaceState({}, '', url);
      } catch (e) {}

      fetchCatalogFromDatabase();
      setTimeout(updateCategoryScrollIndicators, 50);
    }

    function clearSearchFilter() {
      currentSearch = '';
      currentPage = 1;
      try {
        const url = new URL(window.location);
        url.searchParams.delete('search');
        url.searchParams.delete('q');
        url.searchParams.delete('page');
        window.history.replaceState({}, '', url);
      } catch (e) {}
      fetchCatalogFromDatabase();
      setTimeout(updateCategoryScrollIndicators, 50);
    }

    function resetAllFilters() {
      currentCategory = 'all';
      currentGender = 'all';
      currentSearch = '';
      currentPage = 1;

      document.querySelectorAll('.category-pill').forEach(b => b.classList.toggle('active', b.dataset.category === 'all'));
      document.querySelectorAll('.gender-btn').forEach(b => b.classList.toggle('active', b.textContent.trim().toLowerCase() === 'all'));

      try {
        const url = new URL(window.location);
        url.searchParams.delete('category');
        url.searchParams.delete('gender');
        url.searchParams.delete('search');
        url.searchParams.delete('q');
        url.searchParams.delete('page');
        window.history.replaceState({}, '', url);
      } catch (e) {}

      fetchCatalogFromDatabase();
      setTimeout(updateCategoryScrollIndicators, 50);
    }

    // Update visibility of category scroll cues based on scroll position under 992px
    function updateCategoryScrollIndicators() {
      const list = document.getElementById('categoryFilterStrip');
      const leftCue = document.getElementById('categoryTabsCueLeft');
      const rightCue = document.getElementById('categoryTabsCueRight');
      if (!list || !leftCue || !rightCue) return;

      const maxScroll = list.scrollWidth - list.clientWidth;
      if (maxScroll <= 4) {
        leftCue.style.opacity = '0';
        rightCue.style.opacity = '0';
        return;
      }

      // Left cue (hidden if at start)
      if (list.scrollLeft <= 10) {
        leftCue.style.opacity = '0';
      } else {
        leftCue.style.opacity = '1';
      }

      // Right cue (hidden if at end)
      if (list.scrollLeft >= maxScroll - 10) {
        rightCue.style.opacity = '0';
      } else {
        rightCue.style.opacity = '1';
      }
    }

    const catStripList = document.getElementById('categoryFilterStrip');
    if (catStripList) {
      catStripList.addEventListener('scroll', updateCategoryScrollIndicators, { passive: true });
      window.addEventListener('resize', updateCategoryScrollIndicators, { passive: true });
    }

    // Auto-filter based on URL Query Parameters (?search=, ?category=, ?gender=, ?page=)
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const catParam = urlParams.get('category');
      const genderParam = urlParams.get('gender');
      const searchParam = urlParams.get('search') || urlParams.get('q');
      const pageParam = parseInt(urlParams.get('page'), 10);

      if (pageParam && pageParam > 1) {
        currentPage = Math.min(pageParam, MAX_PAGES);
      }

      if (searchParam) {
        currentSearch = searchParam.toLowerCase().trim();
      }

      if (genderParam) {
        currentGender = genderParam.toLowerCase().trim();
        const genderBtns = Array.from(document.querySelectorAll('.gender-btn'));
        const activeBtn = genderBtns.find(b => b.textContent.trim().toLowerCase() === currentGender);
        if (activeBtn) {
          genderBtns.forEach(b => b.classList.remove('active'));
          activeBtn.classList.add('active');
        }
      }

      if (catParam) {
        const targetCat = catParam.toLowerCase().trim();
        const pills = Array.from(document.querySelectorAll('.category-pill'));
        const catBtn = pills.find(b => {
          const pillCat = (b.dataset.category || '').toLowerCase();
          return pillCat === targetCat || b.textContent.toLowerCase().includes(targetCat);
        });

        pills.forEach(b => b.classList.remove('active'));
        if (catBtn) {
          catBtn.classList.add('active');
          currentCategory = (catBtn.dataset.category || targetCat).toLowerCase();
        } else {
          currentCategory = targetCat;
        }
      }

      // Hook up sort dropdown
      const sortSelect = document.querySelector('.sort-select-compact');
      if (sortSelect) {
        currentSort = sortSelect.value || 'featured';
        sortSelect.addEventListener('change', () => {
          currentSort = sortSelect.value;
          currentPage = 1;
          fetchCatalogFromDatabase();
        });
      }

      fetchCatalogFromDatabase();
      setTimeout(updateCategoryScrollIndicators, 50);
    });
  </script>
</body>
</html>
