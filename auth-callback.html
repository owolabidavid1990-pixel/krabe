<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating — Krabe Kollection</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0B0C10;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #94A3B8;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <div class="spinner"></div>
  <p id="authStatusText">Authenticating your account...</p>

  <script>
    (async function () {
      const client = window.KRABE_CONFIG ? window.KRABE_CONFIG.client : null;
      let session = null;
      let authError = null;

      if (client) {
        try {
          // getSession triggers detectSessionInUrl and parses tokens/code from URL
          const { data, error } = await client.auth.getSession();
          if (error) {
            authError = error.message;
          } else {
            session = data?.session || null;
          }
        } catch (e) {
          console.error('[Auth Callback] Error establishing session:', e);
          authError = e?.message || 'Authentication failed.';
        }
      } else {
        authError = 'Supabase client not available.';
      }

      // Check if authentication genuinely succeeded
      const isSuccess = Boolean(session && session.user);

      // If opened inside a popup window, message parent window and close
      if (window.opener && window.opener !== window) {
        try {
          if (isSuccess) {
            window.opener.postMessage({ type: 'KRABE_AUTH_SUCCESS', session: session }, window.location.origin);
          } else {
            window.opener.postMessage({ type: 'KRABE_AUTH_ERROR', error: authError || 'Authentication was cancelled or failed.' }, window.location.origin);
          }
        } catch (_) {}
        setTimeout(() => {
          window.close();
        }, 150);
      } else {
        // Fallback for full-page redirect
        if (isSuccess) {
          window.location.href = 'account.html';
        } else {
          const statusText = document.getElementById('authStatusText');
          if (statusText) statusText.textContent = 'Authentication failed. Redirecting...';
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1200);
        }
      }
    })();
  </script>
</body>
</html>
